
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 2 -type f -name 'HozorGhiyabAndroid_PhoneBuild_v9.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          mkdir -p output
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HozorGhiyab-debug-apk
          path: output/*.apk
          if-no-files-found: error

