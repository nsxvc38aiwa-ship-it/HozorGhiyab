name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HozorGhiyabAndroid_PhoneBuild_v2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q HozorGhiyabAndroid_PhoneBuild_v2.zip

      - name: Build debug APK
        run: |
          cd HozorGhiyabAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HozorGhiyab-APK
          path: HozorGhiyabAndroid/app/build/outputs/apk/debug/app-debug.apk
